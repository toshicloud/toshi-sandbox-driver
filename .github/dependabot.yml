version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
    groups:
      go-modules:
        patterns:
          - "*"
